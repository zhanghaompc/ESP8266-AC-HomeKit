; ESP8266 空调红外控制器：HomeKit(Mixiaoxiao) + WiFi + MQTT，无蓝牙
[env:esp8266_homekit]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L   ; HomeKit 配对要求 160MHz，否则 iOS 超时断连
lib_deps = 
	crankyoldgit/IRremoteESP8266@2.8.6
	fastled/FastLED@3.10.3
	adafruit/Adafruit AHTX0@2.0.5
	bblanchon/ArduinoJson@7.4.2
	arduino-libraries/NTPClient@^3.2.1
	knolleary/PubSubClient@^2.8
	tzapu/WiFiManager@^2.0.17
	; HomeKit-ESP8266 已内置在 lib/ 目录（其 base64.h 已改名避免与核心冲突）
; HomeKit 库自带 base64.h 会遮蔽 ESP8266 核心同名头文件，把核心 include 路径提前
build_flags = 
	-I${platformio.packages_dir}/framework-arduinoespressif8266/cores/esp8266
	-DMQTT_MAX_PACKET_SIZE=1536
lib_ldf_mode = deep+
